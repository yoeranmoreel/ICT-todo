<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ICT-jaarplanner</title>
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#c4622d">
<link rel="apple-touch-icon" href="./icon-192.png">
<style>
  :root{
    --ink:#2b2820;
    --paper:#faf6ee;
    --line:#d8cfb8;
    --q1:#c4622d;
    --q2:#3d5a80;
    --q3:#5a7d4a;
    --q4:#c9a227;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    background-image: linear-gradient(var(--line) 1px, transparent 1px);
    background-size: 100% 2.1em;
    color:var(--ink);
    font-family: 'Georgia', 'Iowan Old Style', serif;
    padding: 2.5em 1.2em 4em;
    min-height:100vh;
  }
  .wrap{max-width:720px;margin:0 auto;}
  header{margin-bottom:1.2em; display:flex; justify-content:space-between; align-items:flex-start; gap:1em;}
  h1{
    font-family:'Helvetica Neue', Arial, sans-serif;
    font-weight:700; font-size:1.5em; letter-spacing:-0.01em; margin:0 0 0.15em;
  }
  .sub{font-family:'Helvetica Neue', Arial, sans-serif; font-size:0.82em; color:#79725f; margin:0;}
  .authbox{font-family:'Helvetica Neue', Arial, sans-serif; font-size:0.78em; text-align:right; flex-shrink:0;}
  .authbox button{
    font-family:inherit; font-size:0.95em; font-weight:600;
    background:var(--ink); color:#fff; border:none; border-radius:6px;
    padding:0.5em 0.8em; cursor:pointer;
  }
  .authbox .email{color:#79725f; margin-bottom:0.4em; word-break:break-word;}
  .signout{background:none !important; color:#b8ac8f !important; text-decoration:underline; padding:0 !important; font-weight:400 !important;}
  .syncstate{font-family:'Helvetica Neue', Arial, sans-serif; font-size:0.72em; color:#a39c85; margin-top:0.3em;}
  .gate{
    font-family:'Helvetica Neue', Arial, sans-serif;
    text-align:center; padding:4em 1em; color:#79725f;
  }
  .gate button{
    font-family:inherit; font-size:1em; font-weight:600;
    background:var(--q1); color:#fff; border:none; border-radius:8px;
    padding:0.8em 1.4em; cursor:pointer; margin-top:1em;
  }
  .tabs{display:flex; gap:0.4em; margin:1.6em 0 1.4em; flex-wrap:wrap;}
  .tab{
    font-family:'Helvetica Neue', Arial, sans-serif; font-size:0.78em; font-weight:600;
    padding:0.55em 0.9em; border-radius:999px; border:1.5px solid var(--line);
    background:transparent; cursor:pointer; color:var(--ink); opacity:0.55;
    transition:opacity .15s, border-color .15s, background .15s; white-space:nowrap;
  }
  .tab[data-active="true"]{opacity:1; background:var(--tab-color); border-color:var(--tab-color); color:#fff;}
  .quarter{display:none;}
  .quarter[data-visible="true"]{display:block;}
  .qhead{display:flex; align-items:baseline; justify-content:space-between; border-bottom:2px solid var(--accent); padding-bottom:0.4em; margin-bottom:0.9em;}
  .qhead h2{font-family:'Helvetica Neue', Arial, sans-serif; font-size:1.05em; margin:0; color:var(--accent);}
  .qhead .progress{font-family:'Helvetica Neue', Arial, sans-serif; font-size:0.75em; color:#79725f;}
  ul.items{list-style:none; margin:0 0 1em; padding:0;}
  li.item{display:flex; align-items:flex-start; gap:0.65em; padding:0.55em 0.1em; border-bottom:1px dashed var(--line); font-size:0.95em; line-height:1.4;}
  li.item.done .label{text-decoration:line-through; color:#a39c85;}
  li.item input[type="checkbox"]{
    appearance:none; -webkit-appearance:none; width:1.1em; height:1.1em;
    border:1.5px solid var(--accent); border-radius:4px; margin-top:0.18em;
    flex-shrink:0; cursor:pointer; position:relative;
  }
  li.item input[type="checkbox"]:checked{background:var(--accent);}
  li.item input[type="checkbox"]:checked::after{
    content:""; position:absolute; left:0.28em; top:0.05em;
    width:0.32em; height:0.55em; border:solid white; border-width:0 2px 2px 0; transform:rotate(40deg);
  }
  .label{flex:1;}
  .del{background:none;border:none;color:#b8ac8f;cursor:pointer;font-size:1em;line-height:1;padding:0.1em 0.3em;flex-shrink:0;}
  .del:hover{color:#c4622d;}
  .addrow{display:flex; gap:0.5em; margin-top:0.6em;}
  .addrow input[type="text"]{
    flex:1; font-family:inherit; font-size:0.92em; padding:0.5em 0.65em;
    border:1.5px solid var(--line); border-radius:6px; background:#fff; color:var(--ink);
  }
  .addrow input[type="text"]:focus{outline:2px solid var(--accent); outline-offset:1px;}
  .addrow button{
    font-family:'Helvetica Neue', Arial, sans-serif; font-size:0.85em; font-weight:600;
    background:var(--accent); color:#fff; border:none; border-radius:6px; padding:0 0.9em; cursor:pointer;
  }
  .addrow button:hover{filter:brightness(1.08);}
  .note{font-family:'Helvetica Neue', Arial, sans-serif; font-size:0.76em; color:#928a72; margin-top:2em; border-top:1px solid var(--line); padding-top:0.9em;}
  .loading{font-family:'Helvetica Neue',Arial,sans-serif; font-size:0.85em; color:#928a72;}
  .hidden{display:none !important;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>ICT-jaarplanner</h1>
      <p class="sub">Houvast voor je ambulante dagen — verdeeld over het schooljaar</p>
    </div>
    <div class="authbox" id="authbox"></div>
  </header>

  <div id="gate" class="gate hidden">
    <p>Log in om je checklist op al je apparaten te zien.</p>
    <button id="loginBtn">Inloggen met Google</button>
  </div>

  <div id="app" class="hidden">
    <nav class="tabs" id="tabs"></nav>
    <div id="quarters"></div>
    <p class="note">Vinkjes en toevoegingen worden automatisch gesynchroniseerd zodra je online bent.</p>
  </div>
</div>

<!-- ============================================================
     FIREBASE CONFIG — vul dit in met je eigen projectgegevens
     (Firebase Console → Project settings → Your apps → SDK config)
     ============================================================ -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
import {
  getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js";
import {
  getFirestore, doc, getDoc, setDoc, enableIndexedDbPersistence
} from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDGQU0GlGpVDlrAEHPUjcf9cEUUImkvTNQ",
  authDomain: "ict-to-do-checklist.firebaseapp.com",
  projectId: "ict-to-do-checklist",
  storageBucket: "ict-to-do-checklist.firebasestorage.app",
  messagingSenderId: "35621995389",
  appId: "1:35621995389:web:d42d2feabedba478b7c214",
  measurementId: "G-8G6MLQV1TP"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
try { enableIndexedDbPersistence(db); } catch (e) { /* multi-tab: negeren */ }

const QUARTERS = [
  { id:"q1", label:"Tot herfstvakantie", color:"var(--q1)",
    items:[
      "Accounts nieuwe leerlingen/collega's controleren",
      "Devices testen na de zomer (digiborden, laptops, Chromebooks)",
      "Softwarelicenties checken voor het nieuwe jaar",
      "AVG-mail 1 versturen",
      "OneDrive-link 1 versturen (foto's)"
    ]},
  { id:"q2", label:"Tot kerst-/voorjaarsvakantie", color:"var(--q2)",
    items:[
      "AVG-mail 2 versturen",
      "OneDrive-link 2 versturen (foto's)",
      "Devices check voor kerstvakantie (alles uit/opgeruimd)",
      "Rondes blijven lopen (2-3 wekelijks ritme)"
    ]},
  { id:"q3", label:"Tot meivakantie", color:"var(--q3)",
    items:[
      "AVG-mail 3 versturen",
      "OneDrive-link 3 versturen (foto's)",
      "Devices voorbereiden op eindtoets/Cito",
      "Licentie- en abonnementsdata check (verlengingen op tijd)"
    ]},
  { id:"q4", label:"Tot zomervakantie", color:"var(--q4)",
    items:[
      "OneDrive-link 4 versturen (foto's)",
      "Accounts groep 8 afsluiten/archiveren",
      "Devices inventariseren en zomerklaar zetten",
      "Back-up maken voor de zomer",
      "Jaar evalueren: wat volgend jaar anders?"
    ]}
];

let state = {};
let activeQ = "q1";
let currentUser = null;
let saveTimer = null;

function defaultState(){
  const s = {};
  QUARTERS.forEach(q => { s[q.id] = q.items.map(t => ({text:t, done:false})); });
  return s;
}

async function loadState(uid){
  const ref = doc(db, "users", uid, "planner", "state");
  const snap = await getDoc(ref);
  if (snap.exists() && snap.data().quarters) {
    state = snap.data().quarters;
    // vul ontbrekende kwartalen aan (bv. na een update van de app)
    QUARTERS.forEach(q => { if(!state[q.id]) state[q.id] = q.items.map(t=>({text:t, done:false})); });
  } else {
    state = defaultState();
    await setDoc(ref, { quarters: state, updatedAt: Date.now() });
  }
}

function queueSave(){
  if (!currentUser) return;
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async () => {
    const ref = doc(db, "users", currentUser.uid, "planner", "state");
    await setDoc(ref, { quarters: state, updatedAt: Date.now() });
  }, 400);
}

function renderTabs(){
  const tabs = document.getElementById('tabs');
  tabs.innerHTML = '';
  QUARTERS.forEach(q=>{
    const btn = document.createElement('button');
    btn.className = 'tab';
    btn.textContent = q.label;
    btn.style.setProperty('--tab-color', q.color);
    btn.dataset.active = (q.id === activeQ) ? "true" : "false";
    btn.onclick = ()=>{ activeQ = q.id; renderTabs(); renderQuarters(); };
    tabs.appendChild(btn);
  });
}

function renderQuarters(){
  const container = document.getElementById('quarters');
  container.innerHTML = '';
  QUARTERS.forEach(q=>{
    const sec = document.createElement('section');
    sec.className = 'quarter';
    sec.dataset.visible = (q.id === activeQ) ? "true" : "false";
    sec.style.setProperty('--accent', q.color);

    const items = state[q.id] || [];
    const doneCount = items.filter(i=>i.done).length;

    const head = document.createElement('div');
    head.className = 'qhead';
    head.innerHTML = `<h2>${q.label}</h2><span class="progress">${doneCount}/${items.length}</span>`;
    sec.appendChild(head);

    const ul = document.createElement('ul');
    ul.className = 'items';
    items.forEach((item, idx)=>{
      const li = document.createElement('li');
      li.className = 'item' + (item.done ? ' done' : '');
      const cb = document.createElement('input');
      cb.type = 'checkbox';
      cb.checked = item.done;
      cb.onchange = ()=>{
        state[q.id][idx].done = cb.checked;
        queueSave();
        renderQuarters();
      };
      const label = document.createElement('span');
      label.className = 'label';
      label.textContent = item.text;
      const del = document.createElement('button');
      del.className = 'del';
      del.textContent = '✕';
      del.title = 'Verwijderen';
      del.onclick = ()=>{
        state[q.id].splice(idx,1);
        queueSave();
        renderQuarters();
      };
      li.appendChild(cb);
      li.appendChild(label);
      li.appendChild(del);
      ul.appendChild(li);
    });
    sec.appendChild(ul);

    const addrow = document.createElement('div');
    addrow.className = 'addrow';
    const input = document.createElement('input');
    input.type = 'text';
    input.placeholder = 'Taak toevoegen…';
    const addBtn = document.createElement('button');
    addBtn.textContent = 'Toevoegen';
    const doAdd = ()=>{
      const val = input.value.trim();
      if(!val) return;
      state[q.id].push({text:val, done:false});
      input.value='';
      queueSave();
      renderQuarters();
    };
    addBtn.onclick = doAdd;
    input.onkeydown = (e)=>{ if(e.key==='Enter') doAdd(); };
    addrow.appendChild(input);
    addrow.appendChild(addBtn);
    sec.appendChild(addrow);

    container.appendChild(sec);
  });
}

function renderAuthBox(){
  const box = document.getElementById('authbox');
  if (currentUser) {
    box.innerHTML = `<div class="email">${currentUser.email || currentUser.displayName || 'Ingelogd'}</div>
      <button class="signout" id="signoutBtn">Uitloggen</button>`;
    document.getElementById('signoutBtn').onclick = () => signOut(auth);
  } else {
    box.innerHTML = '';
  }
}

document.getElementById('loginBtn').onclick = () => {
  signInWithPopup(auth, new GoogleAuthProvider()).catch(err => {
    alert('Inloggen mislukt: ' + err.message);
  });
};

onAuthStateChanged(auth, async (user) => {
  currentUser = user;
  renderAuthBox();
  if (user) {
    document.getElementById('gate').classList.add('hidden');
    document.getElementById('app').classList.add('hidden');
    document.getElementById('quarters').innerHTML = '<p class="loading">Laden…</p>';
    document.getElementById('app').classList.remove('hidden');
    await loadState(user.uid);
    renderTabs();
    renderQuarters();
  } else {
    document.getElementById('app').classList.add('hidden');
    document.getElementById('gate').classList.remove('hidden');
  }
});

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./service-worker.js').catch(()=>{});
  });
}
</script>
</body>
</html>
