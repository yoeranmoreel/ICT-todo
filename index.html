<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#ffffff">
    <title>Ambulante Dag To-Do</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f5f5f5;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        .header {
            background: white;
            padding: 24px;
            border: 1px solid #e0e0e0;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        h1 {
            color: #212121;
            font-size: 24px;
            font-weight: 600;
        }

        .settings-btn {
            padding: 8px 16px;
            background: #212121;
            color: white;
            border: none;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
        }

        .settings-btn:hover {
            background: #424242;
        }

        /* Settings Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal.show {
            display: flex;
        }

        .modal-content {
            background: white;
            padding: 32px;
            border-radius: 8px;
            max-width: 400px;
            width: 100%;
        }

        .modal-title {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 20px;
            color: #212121;
        }

        .day-checkboxes {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-bottom: 20px;
        }

        .checkbox-item {
            display: flex;
            align-items: center;
        }

        .checkbox-item input {
            width: 18px;
            height: 18px;
            margin-right: 8px;
        }

        .checkbox-item label {
            cursor: pointer;
            font-size: 14px;
            color: #424242;
        }

        .modal-buttons {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
        }

        .modal-buttons .btn {
            padding: 10px 20px;
        }

        .agenda-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 16px;
            margin-bottom: 20px;
        }

        .day-card {
            background: white;
            border: 1px solid #e0e0e0;
            cursor: pointer;
            transition: all 0.2s;
            position: relative;
        }

        .day-card:hover {
            border-color: #424242;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        .day-card.active {
            border: 2px solid #212121;
            background: #fafafa;
        }

        .day-card-header {
            padding: 16px;
            border-bottom: 1px solid #e0e0e0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .day-card-title {
            font-weight: 600;
            color: #212121;
            font-size: 16px;
        }

        .day-card-date {
            font-size: 12px;
            color: #9e9e9e;
            margin-top: 4px;
        }

        .flag-indicator {
            width: 24px;
            height: 24px;
            background: #ef4444;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            color: white;
            font-weight: 600;
        }

        .day-card-content {
            padding: 16px;
        }

        .day-summary {
            font-size: 13px;
            color: #757575;
            margin-bottom: 12px;
        }

        .summary-bar {
            height: 4px;
            background: #e0e0e0;
            border-radius: 2px;
            overflow: hidden;
            margin-top: 8px;
        }

        .summary-bar-fill {
            height: 100%;
            background: #4caf50;
            transition: width 0.3s;
        }

        .detail-view {
            display: none;
        }

        .detail-view.show {
            display: block;
        }

        .detail-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .detail-back {
            padding: 8px 16px;
            background: white;
            border: 1px solid #e0e0e0;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
        }

        .detail-back:hover {
            background: #f5f5f5;
        }

        .add-task-form {
            background: white;
            padding: 20px;
            border: 1px solid #e0e0e0;
            margin-bottom: 20px;
        }

        .input-group {
            display: flex;
            gap: 10px;
        }

        #taskInput {
            flex: 1;
            padding: 10px 12px;
            border: 1px solid #bdbdbd;
            font-size: 14px;
        }

        #taskInput:focus {
            outline: none;
            border-color: #424242;
        }

        .btn {
            padding: 10px 20px;
            background: #212121;
            color: white;
            border: none;
            cursor: pointer;
            font-weight: 500;
            font-size: 14px;
            transition: background 0.2s;
        }

        .btn:hover {
            background: #424242;
        }

        .btn:disabled {
            background: #bdbdbd;
            cursor: not-allowed;
        }

        .tasks-container {
            background: white;
            padding: 20px;
            border: 1px solid #e0e0e0;
        }

        .task-list {
            list-style: none;
        }

        .task-item {
            display: flex;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid #f0f0f0;
        }

        .task-item:last-child {
            border-bottom: none;
        }

        .task-checkbox {
            width: 18px;
            height: 18px;
            margin-right: 12px;
            cursor: pointer;
        }

        .task-text {
            flex: 1;
            font-size: 14px;
            color: #212121;
        }

        .task-item.completed .task-text {
            text-decoration: line-through;
            color: #9e9e9e;
        }

        .delete-btn {
            padding: 6px 14px;
            background: white;
            color: #757575;
            border: 1px solid #e0e0e0;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.2s;
        }

        .delete-btn:hover {
            background: #f5f5f5;
            border-color: #bdbdbd;
            color: #424242;
        }

        .empty-state {
            text-align: center;
            padding: 40px;
            color: #9e9e9e;
            font-size: 14px;
        }

        .stats {
            display: flex;
            gap: 20px;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid #f0f0f0;
            font-size: 13px;
            color: #757575;
        }

        .loading {
            text-align: center;
            padding: 20px;
            color: #757575;
            font-size: 14px;
        }

        .error {
            background: #ffebee;
            border: 1px solid #ef5350;
            padding: 12px;
            color: #c62828;
            font-size: 13px;
            margin-bottom: 20px;
        }

        .sync-indicator {
            font-size: 12px;
            color: #9e9e9e;
            text-align: right;
            margin-top: 8px;
        }

        .sync-indicator.syncing {
            color: #2196f3;
        }

        .today-indicator {
            border: 2px solid #4caf50 !important;
        }

        .past-indicator {
            opacity: 0.6;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Ambulante Dag To-Do</h1>
            <button class="settings-btn" onclick="openSettings()">Instellingen</button>
        </div>

        <!-- Settings Modal -->
        <div id="settingsModal" class="modal">
            <div class="modal-content">
                <div class="modal-title">Selecteer je ICT-dagen</div>
                <div class="day-checkboxes">
                    <div class="checkbox-item">
                        <input type="checkbox" id="day-maandag" value="maandag">
                        <label for="day-maandag">Maandag</label>
                    </div>
                    <div class="checkbox-item">
                        <input type="checkbox" id="day-dinsdag" value="dinsdag">
                        <label for="day-dinsdag">Dinsdag</label>
                    </div>
                    <div class="checkbox-item">
                        <input type="checkbox" id="day-woensdag" value="woensdag">
                        <label for="day-woensdag">Woensdag</label>
                    </div>
                    <div class="checkbox-item">
                        <input type="checkbox" id="day-donderdag" value="donderdag">
                        <label for="day-donderdag">Donderdag</label>
                    </div>
                    <div class="checkbox-item">
                        <input type="checkbox" id="day-vrijdag" value="vrijdag">
                        <label for="day-vrijdag">Vrijdag</label>
                    </div>
                </div>
                <div class="modal-buttons">
                    <button class="btn" style="background: #bdbdbd;" onclick="closeSettings()">Annuleer</button>
                    <button class="btn" onclick="saveSettings()">Opslaan</button>
                </div>
            </div>
        </div>

        <div id="errorMessage" class="error" style="display: none;"></div>

        <!-- Agenda View -->
        <div id="agendaView" class="agenda-grid"></div>

        <!-- Detail View -->
        <div id="detailView" class="detail-view">
            <div class="detail-header">
                <button class="detail-back" onclick="showAgenda()">← Terug</button>
                <h2 id="detailTitle" style="color: #212121; font-size: 20px; flex: 1; text-align: center;"></h2>
                <div style="width: 100px;"></div>
            </div>

            <div class="add-task-form">
                <div class="input-group">
                    <input type="text" id="taskInput" placeholder="Nieuwe taak toevoegen...">
                    <button class="btn" id="addBtn">Toevoegen</button>
                </div>
            </div>

            <div class="tasks-container">
                <div class="loading" id="loading">Taken laden...</div>
                <ul class="task-list" id="taskList"></ul>
                <div class="empty-state" id="emptyState" style="display: none;">
                    Geen taken voor deze dag
                </div>
                <div class="stats" id="stats"></div>
                <div class="sync-indicator" id="syncIndicator"></div>
            </div>
        </div>
    </div>

    <!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore-compat.js"></script>

    <script>
       const firebaseConfig = {
  apiKey: "AIzaSyA4H-lM1idKqZxsdydionsWaMbT-skhQok",
  authDomain: "to-do-ambulant.firebaseapp.com",
  projectId: "to-do-ambulant",
  storageBucket: "to-do-ambulant.firebasestorage.app",
  messagingSenderId: "278422368014",
  appId: "1:278422368014:web:c9a49cdc09ebfbc18e715f"
};

        const app = firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore(app);

        let currentDay = 'woensdag';
        let unsubscribe = null;
        let allDaysData = {};
        let selectedDays = ['woensdag', 'donderdag', 'vrijdag'];

        // Load settings
        function loadSettings() {
            const saved = localStorage.getItem('ictDays');
            if (saved) {
                selectedDays = JSON.parse(saved);
            }
            allDaysData = {};
            selectedDays.forEach(day => {
                allDaysData[day] = [];
            });
        }

        function openSettings() {
            document.getElementById('settingsModal').classList.add('show');
            selectedDays.forEach(day => {
                document.getElementById('day-' + day).checked = true;
            });
        }

        function closeSettings() {
            document.getElementById('settingsModal').classList.remove('show');
        }

        function saveSettings() {
            const checked = Array.from(document.querySelectorAll('.day-checkboxes input:checked'))
                .map(el => el.value);
            
            if (checked.length === 0) {
                alert('Selecteer minstens één dag!');
                return;
            }
            
            selectedDays = checked.sort((a, b) => {
                const dayOrder = { maandag: 0, dinsdag: 1, woensdag: 2, donderdag: 3, vrijdag: 4 };
                return dayOrder[a] - dayOrder[b];
            });
            
            localStorage.setItem('ictDays', JSON.stringify(selectedDays));
            allDaysData = {};
            selectedDays.forEach(day => {
                allDaysData[day] = [];
            });
            
            closeSettings();
            loadAllDaysRealtime();
            renderAgenda();
        }

        function getDayDate(day) {
            const today = new Date();
            const todayDay = today.getDay();
            
            const dayMap = { maandag: 1, dinsdag: 2, woensdag: 3, donderdag: 4, vrijdag: 5 };
            const targetDay = dayMap[day];
            
            let daysOffset = (targetDay - todayDay + 7) % 7;
            if (daysOffset === 0 && todayDay !== targetDay) {
                daysOffset = 7;
            }
            
            const date = new Date(today);
            date.setDate(date.getDate() + daysOffset);
            return date;
        }

        function loadAllDaysRealtime() {
            selectedDays.forEach(day => {
                db.collection('ambulante_taken')
                    .doc(day)
                    .onSnapshot((doc) => {
                        if (doc.exists) {
                            allDaysData[day] = doc.data().tasks || [];
                        } else {
                            allDaysData[day] = [];
                        }
                        renderAgenda();
                    });
            });
        }

        function renderAgenda() {
            const agendaGrid = document.getElementById('agendaView');
            agendaGrid.innerHTML = '';

            selectedDays.forEach(day => {
                const tasks = allDaysData[day] || [];
                const incomplete = tasks.filter(t => !t.completed).length;
                const complete = tasks.filter(t => t.completed).length;
                const total = tasks.length;
                const percentage = total > 0 ? Math.round((complete / total) * 100) : 0;

                const dayDate = getDayDate(day);
                const dateStr = dayDate.toLocaleDateString('nl-NL', { month: 'short', day: 'numeric' });
                const isToday = new Date().toDateString() === dayDate.toDateString();
                const isPast = dayDate < new Date() && !isToday;

                let classNames = 'day-card';
                if (isPast && incomplete > 0) classNames += ' past-indicator';
                if (isToday) classNames += ' today-indicator';
                if (currentDay === day) classNames += ' active';

                const dayNames = { maandag: 'Maandag', dinsdag: 'Dinsdag', woensdag: 'Woensdag', donderdag: 'Donderdag', vrijdag: 'Vrijdag' };

                const card = document.createElement('div');
                card.className = classNames;
                card.onclick = () => showDetail(day);
                card.innerHTML = `
                    <div class="day-card-header">
                        <div>
                            <div class="day-card-title">${dayNames[day]}</div>
                            <div class="day-card-date">${dateStr}</div>
                        </div>
                        ${incomplete > 0 ? `<div class="flag-indicator">${incomplete}</div>` : ''}
                    </div>
                    <div class="day-card-content">
                        <div class="day-summary">
                            ${total === 0 ? 'Geen taken' : `${complete}/${total} voltooid`}
                        </div>
                        <div class="summary-bar">
                            <div class="summary-bar-fill" style="width: ${percentage}%"></div>
                        </div>
                    </div>
                `;

                agendaGrid.appendChild(card);
            });
        }

        function showDetail(day) {
            currentDay = day;
            document.getElementById('agendaView').style.display = 'none';
            document.getElementById('detailView').classList.add('show');
            
            const dayNames = { maandag: 'Maandag', dinsdag: 'Dinsdag', woensdag: 'Woensdag', donderdag: 'Donderdag', vrijdag: 'Vrijdag' };
            document.getElementById('detailTitle').textContent = dayNames[day];

            loadTasksRealtime();
        }

        function showAgenda() {
            document.getElementById('agendaView').style.display = 'grid';
            document.getElementById('detailView').classList.remove('show');
            
            if (unsubscribe) unsubscribe();
        }

        async function loadTasksRealtime() {
            const loading = document.getElementById('loading');
            loading.style.display = 'block';

            if (unsubscribe) unsubscribe();

            unsubscribe = db.collection('ambulante_taken')
                .doc(currentDay)
                .onSnapshot((doc) => {
                    loading.style.display = 'none';
                    renderTasks(doc.exists ? doc.data().tasks || [] : []);
                });
        }

        async function addTask() {
            const input = document.getElementById('taskInput');
            const text = input.value.trim();

            if (!text) return;

            const doc = await db.collection('ambulante_taken').doc(currentDay).get();
            const tasks = doc.exists ? doc.data().tasks || [] : [];
            
            tasks.push({ 
                text, 
                completed: false, 
                timestamp: Date.now()
            });
            
            await db.collection('ambulante_taken').doc(currentDay).set({ tasks }, { merge: true });
            input.value = '';
        }

        async function toggleTask(index) {
            const doc = await db.collection('ambulante_taken').doc(currentDay).get();
            const tasks = doc.exists ? doc.data().tasks || [] : [];
            
            if (tasks[index]) {
                tasks[index].completed = !tasks[index].completed;
                await db.collection('ambulante_taken').doc(currentDay).set({ tasks }, { merge: true });
            }
        }

        async function deleteTask(index) {
            if (!confirm('Weet je zeker dat je deze taak wilt verwijderen?')) return;
            
            const doc = await db.collection('ambulante_taken').doc(currentDay).get();
            const tasks = doc.exists ? doc.data().tasks || [] : [];
            
            tasks.splice(index, 1);
            await db.collection('ambulante_taken').doc(currentDay).set({ tasks }, { merge: true });
        }

        function renderTasks(tasks) {
            const taskList = document.getElementById('taskList');
            const emptyState = document.getElementById('emptyState');
            const stats = document.getElementById('stats');

            if (tasks.length === 0) {
                taskList.style.display = 'none';
                emptyState.style.display = 'block';
                stats.innerHTML = '';
                return;
            }

            taskList.style.display = 'block';
            emptyState.style.display = 'none';

            taskList.innerHTML = tasks.map((task, index) => `
                <li class="task-item ${task.completed ? 'completed' : ''}">
                    <input type="checkbox" class="task-checkbox" ${task.completed ? 'checked' : ''} 
                           onchange="toggleTask(${index})">
                    <span class="task-text">${task.text}</span>
                    <button class="delete-btn" onclick="deleteTask(${index})">Verwijder</button>
                </li>
            `).join('');

            const completed = tasks.filter(t => t.completed).length;
            const total = tasks.length;
            stats.innerHTML = `
                <div><strong>${completed}</strong> van <strong>${total}</strong> voltooid</div>
                <div>${total > 0 ? Math.round((completed / total) * 100) : 0}% compleet</div>
            `;
        }

        document.getElementById('addBtn').addEventListener('click', addTask);
        document.getElementById('taskInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') addTask();
        });

        window.toggleTask = toggleTask;
        window.deleteTask = deleteTask;
        window.showAgenda = showAgenda;
        window.showDetail = showDetail;
        window.openSettings = openSettings;
        window.closeSettings = closeSettings;
        window.saveSettings = saveSettings;

        // Initialize
        loadSettings();
        loadAllDaysRealtime();

        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js').catch(err => {
                console.log('Service Worker registratie mislukt:', err);
            });
        }
    </script>
</body>
</html>
